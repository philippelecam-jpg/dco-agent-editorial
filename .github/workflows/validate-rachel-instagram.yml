name: Valider le pipeline Instagram Rachel sans publier
on:
  push:
    branches:
      - test/rachel-instagram-pipeline-2026-11-19
    paths:
      - .github/workflows/validate-rachel-instagram.yml
permissions:
  actions: read
  contents: read
jobs:
  prepare:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Préparer le transfert chiffré temporaire
        run: |
          umask 077
          openssl req -x509 -newkey rsa:3072 -noenc -days 1 -subj /CN=Rachel-Instagram-Apercu -keyout "$RUNNER_TEMP/relay-key.pem" -out "$RUNNER_TEMP/relay-cert.pem" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rachel-instagram-pipeline-certificate
          path: ${{ runner.temp }}/relay-cert.pem
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          name: rachel-bureau-preview
          repository: ${{ github.repository }}
          run-id: 44506476994
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rachel-bureau-preview
      - name: Vérifier et déchiffrer le MP4 Bureau
        env:
          HANDOFF_URL: https://raw.githubusercontent.com/philippelecam-jpg/dco-agent-editorial/refs/heads/test/rachel-instagram-pipeline-2026-11-19/.github/test-data/validate-rachel-instagram-key.cms.asc
        run: |
          cd "$RUNNER_TEMP"
          umask 077
          for attempt in $(seq 1 48); do
            if curl -fsS --max-time 10 "$HANDOFF_URL" -o handoff.asc 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s handoff.asc
          base64 --decode handoff.asc > handoff.cms
          openssl cms -decrypt -binary -inform DER -in handoff.cms -recip relay-cert.pem -inkey relay-key.pem -out original-key.pem
          cat > original-cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEEzCCAnugAwIBAgIUMLRkQM/ouJ5fluj0ljnmiRLRb3IwDQYJKoZIhvcNAQEL
          BQAwGTEXMBUGA1UEAwwOUmFjaGVsLXByZXZpZXcwHhcNMjYxMTE5MTAzMDUwWhcN
          MjYxMTIxMTAzMDUwWjAZMRcwFQYDVQQDDA5SYWNoZWwtcHJldmlldzCCAaIwDQYJ
          KoZIhvcNAQEBBQADggGPADCCAYoCggGBAMg8YotpGkNRZE3UPOJ022vZy2sVk7Jm
