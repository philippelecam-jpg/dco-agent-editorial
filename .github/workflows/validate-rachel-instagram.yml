          PEM
          openssl cms -decrypt -binary -inform DER -in rachel-bureau-preview/Rachel-Bureau-Test.cms -recip original-cert.pem -inkey original-key.pem -out Rachel-Bureau-Test.mp4
          printf '%s  %s\n' efc7b5441c57fae1578d72077a9d3c085ba427dc8a56ae4d281ee7a0b03f7252 Rachel-Bureau-Test.mp4 | sha256sum --check
          rm original-key.pem relay-key.pem
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier les workflows et les tests
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/short_video_avatar.yml .github/workflows/short_video_prospective.yml .github/workflows/instagram_reels.yml
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install requests cryptography pillow pyyaml feedparser requests_oauthlib
          python -m unittest discover -s tests
      - name: Envoyer le MP4 Bureau à Meta sans publier
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python -u - <<'PY'
          import os
          from pathlib import Path
          import instagram_reels as reels

          reels.stage_reel(Path(os.environ["RUNNER_TEMP"]) / "Rachel-Bureau-Test.mp4", {
              "titre": "Validation du pipeline Rachel",
              "resume": "Rendu Bureau original utilisé pour vérifier le traitement chez Meta.",
          }, "TEST_BUREAU")
          manifest, metadata = reels.read_archive()
          attempt = f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          client = reels.Instagram(os.environ["INSTAGRAM_ACCESS_TOKEN"].strip())
          journal = Path(os.environ["RUNNER_TEMP"]) / "checkpoint.json"
          entry = {"youtube_id": manifest["youtube_id"]}
          reels.prepare(client, manifest, metadata, journal, entry, attempt)
          if client.status(entry["container_id"]) != "FINISHED":
              raise SystemExit("Le conteneur n’est pas prêt.")
          print("MP4 Bureau validé par Meta avec le nouveau pipeline. Le Reel reste non publié.")
          PY
