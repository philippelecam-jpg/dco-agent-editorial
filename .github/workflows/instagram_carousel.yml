name: Instagram - carrousel hebdomadaire autonome
on:
  schedule:
    - cron: '0 10,11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Autoriser la publication avant jeudi
        type: boolean
        default: false
concurrency:
  group: rachel-instagram-publication
  cancel-in-progress: false
jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier l’heure de Paris
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$(TZ=Europe/Paris date +%H)" = 12 ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Installer les dépendances
        if: steps.clock.outputs.due == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install requests pillow
      - name: Produire et publier le carrousel
        if: steps.clock.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python -u instagram_carousel.py "${args[@]}"
      - name: Sauvegarder la progression
        if: always() && steps.clock.outputs.due == 'true'
        run: bash scripts/persist_instagram_journal.sh
      - name: Alerter en cas d’échec
        if: failure()
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import requests
          response = requests.post(os.environ['MAKE_WEBHOOK_URL'],
              headers={'x-make-apikey': os.environ['MAKE_API_KEY']},
              json={'alerte': 'echec_carrousel_instagram', 'run_url': os.environ['RUN_URL']}, timeout=30)
          response.raise_for_status()
          PY
