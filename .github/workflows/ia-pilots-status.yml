name: Etat des pilotes IA
on:
  push:
    branches: ['feat/ia-au-bureau-pilots-2026-11-20']
    paths: ['.github/workflows/ia-pilots-status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les trois sessions sans generer
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          ids=['09056684ab8a40b6814c3d78141c5391','c9ac02bc39124fe28597a157f8c2ab4b','09dde3b349f940c792205815451c11af']
          for sid in ids:
              req=urllib.request.Request('https://api.heygen.com/v3/video-agents/'+sid,headers={'X-Api-Key':os.environ['HEYGEN_API_KEY']})
              with urllib.request.urlopen(req,timeout=30) as r:
                  s=json.load(r)['data']
              print(json.dumps({k:s.get(k) for k in ['session_id','status','video_id','progress','created_at','updated_at']},ensure_ascii=False))
              if s.get('video_id'):
                  req=urllib.request.Request('https://api.heygen.com/v3/videos/'+s['video_id'],headers={'X-Api-Key':os.environ['HEYGEN_API_KEY']})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      v=json.load(r)['data']
                  print(json.dumps({k:v.get(k) for k in ['id','status','duration','created_at','started_at','completed_at','failure_code','failure_message']},ensure_ascii=False))
          PY
