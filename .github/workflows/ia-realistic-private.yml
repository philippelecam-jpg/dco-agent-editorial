name: IA au bureau - complément réaliste privé
on:
  push:
    branches: ['feat/ia-au-bureau-pilots-2026-11-20']
    paths: ['.github/workflows/ia-realistic-private.yml']
permissions:
  contents: read
concurrency:
  group: ia-realistic-private
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Générer un seul pilote privé
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python -u scripts/ia_realistic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realistic-checkpoint
          path: pilot-output/checkpoint.json
          retention-days: 30
      - name: Attendre le rendu
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python -u scripts/ia_pilots.py poll
      - name: Chiffrer le résultat privé
        if: always()
        run: |
          python -c "import shutil; shutil.make_archive('realistic-private','zip','pilot-output')"
          openssl cms -encrypt -binary -aes-256-gcm -in realistic-private.zip -out realistic-private.cms -outform DER pilots/ia_au_bureau/review-public.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realistic-private
          path: realistic-private.cms
          retention-days: 30
