          openssl cms -decrypt -binary -inform DER -in rachel-bureau-preview/Rachel-Bureau-Test.cms -recip original-cert.pem -inkey original-key.pem -out Rachel-Bureau-Test.mp4
          printf '%s  %s\n' efc7b5441c57fae1578d72077a9d3c085ba427dc8a56ae4d281ee7a0b03f7252 Rachel-Bureau-Test.mp4 | sha256sum --check
          rm original-key.pem relay-key.pem
      - name: Publier Rachel Bureau sur @decisionsandco
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen

          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "").strip()
          if not token:
              sys.exit("Le secret INSTAGRAM_ACCESS_TOKEN est absent ou vide.")
          graph = "https://graph.facebook.com/v27.0"
          auth = {"Authorization": f"Bearer {token}", "Accept": "application/json"}

          def fetch(action, url, *, data=None, headers=auth, timeout=45):
              try:
                  with urlopen(Request(url, data=data, headers=headers), timeout=timeout) as response:
                      return json.load(response)
              except HTTPError as exc:
                  try:
                      error = json.load(exc)
                  except ValueError:
                      error = {}
                  details = error.get("error", {}) if isinstance(error, dict) else {}
                  details = details if isinstance(details, dict) else {}
                  code = details.get("code", "inconnu")
                  subcode = details.get("error_subcode", "inconnu")
                  code = code if isinstance(code, int) else "inconnu"
                  subcode = subcode if isinstance(subcode, int) else "inconnu"
                  debug_info = error.get("debug_info") if isinstance(error, dict) else None
                  message = details.get("message") or (debug_info.get("message") if isinstance(debug_info, dict) else None)
                  message = message or (error.get("message") if isinstance(error, dict) else None)
                  message = message.replace(token, "[masqué]") if isinstance(message, str) else ""
                  message = " ".join(message.split())[:350]
                  sys.exit(f"{action} : HTTP {exc.code}, code Meta {code}, sous-code {subcode}. {message}")
              except (URLError, ValueError, TimeoutError):
                  sys.exit(f"{action} : problème réseau ou réponse invalide.")

          accounts = fetch("Recherche du compte", f"{graph}/me/assigned_instagram_accounts?fields=id,username&limit=100")["data"]
          account_id = next((str(account.get("id", "")) for account in accounts if account.get("username", "").casefold() == "decisionsandco"), "")
          if not account_id.isdecimal():
              sys.exit("Compte @decisionsandco introuvable ou identifiant invalide.")
          caption = "Un outil IA peut-il vraiment lire vos factures ? Testez-le sur dix factures dont vous connaissez déjà les montants. Pensez à inclure un scan, une devise étrangère et un avoir.\n\nRachel, présentatrice IA de Décisions & Co."

          def find_existing():
              query = urlencode({"fields": "id,caption,permalink", "limit": 30})
              media = fetch("Recherche de doublon", f"{graph}/{account_id}/media?{query}")
              return next((item for item in media["data"] if item.get("caption") == caption), None)

          def confirm_media(media_id):
              if not str(media_id).isdecimal():
                  sys.exit("Identifiant Instagram invalide. Vérifier le profil avant toute nouvelle tentative.")
              print(f"Identifiant du média Instagram : {media_id}", flush=True)
              query = urlencode({"fields": "permalink,media_product_type,is_ai_generated"})
              for attempt in range(4):
                  media = fetch("Vérification du Reel publié", f"{graph}/{media_id}?{query}")
                  link = media.get("permalink", "")
                  if (link.startswith(("https://www.instagram.com/", "https://instagram.com/")) and
                          media.get("media_product_type") == "REELS" and media.get("is_ai_generated") is True):
                      print(f"Reel public confirmé : {link}")
                      print("Label IA confirmé par Meta : is_ai_generated=true.")
                      return
                  if attempt < 3:
                      time.sleep(5)
              if link.startswith(("https://www.instagram.com/", "https://instagram.com/")):
                  print(f"Lien du média : {link}")
              sys.exit("Média créé. Format ou label IA à vérifier avant toute nouvelle tentative.")

          existing = find_existing()
          if existing:
              print("Un média avec cette légende existe déjà. Vérification de la publication existante.")
              confirm_media(existing["id"])
              sys.exit(0)
          form = urlencode({
              "media_type": "REELS",
              "upload_type": "resumable",
              "is_ai_generated": "true",
              "caption": caption,
          }).encode()
          container = fetch("Création du conteneur", f"{graph}/{account_id}/media", data=form)
          container_id = str(container.get("id", ""))
          if not container_id.isdecimal():
              sys.exit("Meta n’a pas retourné un identifiant de conteneur valide.")
          print("Conteneur Reel accepté avec is_ai_generated=true.")
          body = (Path(os.environ["RUNNER_TEMP"]) / "Rachel-Bureau-Test.mp4").read_bytes()
          upload_url = container.get("uri", "")
          endpoint = urlsplit(upload_url)
          if (endpoint.scheme != "https" or endpoint.netloc != "rupload.facebook.com" or
                  not endpoint.path.startswith("/ig-api-upload/") or not endpoint.path.endswith(f"/{container_id}")):
              sys.exit("Meta n’a pas retourné une URL de transfert direct valide pour le conteneur.")
          response = fetch("Envoi du MP4", upload_url, data=body, timeout=90, headers={
              "Authorization": f"OAuth {token}",
              "Content-Type": "application/octet-stream",
              "offset": "0",
              "file_size": str(len(body)),
          })
          if response.get("success") is not True:
              sys.exit("Le service de téléversement n’a pas confirmé la réception du MP4.")
          print("MP4 reçu par Meta.")
          for index in range(6):
              status = fetch("Vérification du traitement", f"{graph}/{container_id}?fields=status_code").get("status_code")
              if status == "FINISHED":
                  print("FINISHED : le Reel est prêt pour la publication.")
                  break
              if status != "IN_PROGRESS":
                  sys.exit(f"Le traitement n’a pas abouti : {status if status in ('ERROR', 'EXPIRED', 'PUBLISHED') else 'état inconnu'}.")
              if index < 5:
                  time.sleep(60)
          else:
              sys.exit("Meta traite encore le Reel après cinq minutes.")

          publish_form = urlencode({"creation_id": container_id}).encode()
          try:
              published = fetch("Publication du Reel", f"{graph}/{account_id}/media_publish", data=publish_form)
          except SystemExit as outcome:
              print("Réponse de publication incertaine. Recherche du Reel, aucun second envoi.")
              time.sleep(6)
              existing = find_existing()
              if not existing:
                  raise outcome
              published = existing
          confirm_media(published.get("id"))
          PY
