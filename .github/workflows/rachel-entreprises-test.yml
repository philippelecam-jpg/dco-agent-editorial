name: Rachel Entreprises — premier test
run-name: La Fabrik · ${{ inputs.request_key || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_key:
        description: 'Identifiant de suivi La Fabrik (automatique, laisser vide en test manuel)'
        type: string
        required: false
      mode:
        description: 'check = accès ; video = MP4 ; youtube_unlisted = génération + YouTube ; youtube_existing = publier un artifact existant'
        type: choice
        options: [check, video, youtube_private, youtube_unlisted, youtube_existing, youtube_finalize]
        default: check
        required: true
      request_id:
        description: 'Référence de demande La Fabrik (automatique)'
        type: string
        required: false
      callback_url:
        description: 'URL de retour La Fabrik (automatique)'
        type: string
        required: false
      resume_run_id:
        description: 'Reprise contrôlée : ID du run précédent contenant le checkpoint et les fichiers'
        type: string
        required: false
      video_run_id:
        description: 'Pour youtube_existing : numéro du run contenant la vidéo'
        type: string
        required: false
      existing_youtube_id:
        description: 'Identifiant YouTube déjà téléversé (automatique, éviter un doublon)'
        type: string
        required: false
      company_name:
        description: 'Entreprise à présenter'
        type: string
        default: 'Décisions & Co'
        required: true
      company_site:
        description: 'Site officiel public'
        type: string
        default: 'https://www.decisionsandco.com'
        required: true
      source_text:
        description: 'Optionnel : texte factuel à utiliser si le site est bloqué'
        type: string
        default: ''
        required: false
      rachel_image:
        description: 'Secteur et image Rachel utilisés par HeyGen'
        type: choice
        options:
          - Rachel Tertiaire
          - Rachel BTP
          - Rachel Agriculture
          - Rachel Industrie
          - Rachel Restauration
          - Rachel Logistique et Transport
        default: Rachel Tertiaire
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rachel-entreprises-first-test
  cancel-in-progress: false

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lead_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuser les reprises automatiques de génération
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo 'Reprise refusée : vérifier les résultats fournisseurs avant un nouveau lancement.'
            exit 1
          fi
      - name: Récupérer le checkpoint d'une exécution précédente
        if: inputs.resume_run_id != '' && inputs.mode != 'check' && inputs.mode != 'youtube_existing' && inputs.mode != 'youtube_finalize'
        uses: actions/download-artifact@v4
        with:
          name: rachel-capsule-${{ inputs.resume_run_id }}
          path: lead_pipeline/test-output
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier les accès de livraison
        if: inputs.callback_url != ''
        env:
          CALLBACK_SECRET: ${{ secrets.LEAD_CALLBACK_SECRET }}
        run: |
          if [ -z "$CALLBACK_SECRET" ]; then
            echo 'LEAD_CALLBACK_SECRET absent : aucun appel payant lancé.'
            exit 1
          fi
      - name: Récupérer une capsule déjà générée
        if: inputs.mode == 'youtube_existing' || inputs.mode == 'youtube_finalize'
        uses: actions/download-artifact@v4
        with:
          name: rachel-capsule-${{ inputs.video_run_id }}
          path: lead_pipeline/test-output
          run-id: ${{ inputs.video_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier le moteur
        run: python -m unittest discover -s tests -v
      - name: Installer les dépendances
        run: |
          pip install -r backend/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Choisir l'image Rachel
        env:
          RACHEL_IMAGE: ${{ inputs.rachel_image }}
        run: |
          case "$RACHEL_IMAGE" in
            'Rachel Tertiaire') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Tertiaire.png' >> "$GITHUB_ENV" ;;
            'Rachel BTP') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel BTP.png' >> "$GITHUB_ENV" ;;
            'Rachel Agriculture') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Agriculture.png' >> "$GITHUB_ENV" ;;
            'Rachel Industrie') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Industrie.png' >> "$GITHUB_ENV" ;;
            'Rachel Restauration') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Restauration.png' >> "$GITHUB_ENV" ;;
            'Rachel Logistique et Transport') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Logistique et Transport.png' >> "$GITHUB_ENV" ;;
            *) echo "Image Rachel inconnue : $RACHEL_IMAGE"; exit 1 ;;
          esac
      - name: Tester la capsule avec les accès Rachel existants
        if: inputs.mode != 'youtube_existing' && inputs.mode != 'youtube_finalize'
        env:
          PYTHONUNBUFFERED: '1'
          TEST_MODE: ${{ inputs.mode == 'check' && 'check' || 'video' }}
          COMPANY_NAME: ${{ inputs.company_name }}
          COMPANY_SITE: ${{ inputs.company_site }}
          SOURCE_TEXT: ${{ inputs.source_text }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u -m backend.first_capsule
      - name: Publier la capsule sur YouTube
        if: inputs.mode == 'youtube_private' || inputs.mode == 'youtube_unlisted' || inputs.mode == 'youtube_existing' || inputs.mode == 'youtube_finalize'
        env:
          TEST_MODE: ${{ inputs.mode }}
          EXISTING_YOUTUBE_ID: ${{ inputs.existing_youtube_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u -m backend.publish_capsule
      - name: Transmettre le résultat à La Fabrik
        if: always() && inputs.callback_url != '' && inputs.mode != 'check'
        env:
          LEAD_CALLBACK_URL: ${{ inputs.callback_url }}
          LEAD_REQUEST_ID: ${{ inputs.request_id }}
          LEAD_REQUEST_KEY: ${{ inputs.request_key }}
          LEAD_CALLBACK_SECRET: ${{ secrets.LEAD_CALLBACK_SECRET }}
        run: python -u -m backend.lead_callback
      - name: Conserver la vidéo et le rapport
        if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: rachel-capsule-${{ github.run_id }}
          path: |
            lead_pipeline/test-output/checkpoint.json
            lead_pipeline/test-output/voice.mp3
            lead_pipeline/test-output/rachel.mp4
            lead_pipeline/test-output/report.json
          if-no-files-found: ignore
          retention-days: 7
