name: Rachel Entreprises — vérification Décisions & Co
on:
  push:
    branches: [test/rachel-decisions-co-2026-11-17]
    paths: [.github/workflows/rachel-verification-2026-11-17.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: rachel-entreprises-first-test
  cancel-in-progress: false

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lead_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuser les reprises automatiques de génération
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo 'Reprise refusée : vérifier les résultats fournisseurs avant un nouveau lancement.'
            exit 1
          fi
      - name: Récupérer le checkpoint d'une exécution précédente
        if: '' != '' && 'youtube_unlisted' != 'check' && 'youtube_unlisted' != 'youtube_existing' && 'youtube_unlisted' != 'youtube_finalize'
        uses: actions/download-artifact@v4
        with:
          name: rachel-capsule-${{ '' }}
          path: lead_pipeline/test-output
          run-id: ${{ '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier les accès de livraison
        if: '' != ''
        env:
          CALLBACK_SECRET: ${{ secrets.LEAD_CALLBACK_SECRET }}
        run: |
          if [ -z "$CALLBACK_SECRET" ]; then
            echo 'LEAD_CALLBACK_SECRET absent : aucun appel payant lancé.'
            exit 1
          fi
      - name: Récupérer une capsule déjà générée
        if: 'youtube_unlisted' == 'youtube_existing' || 'youtube_unlisted' == 'youtube_finalize'
        uses: actions/download-artifact@v4
        with:
          name: rachel-capsule-${{ '' }}
          path: lead_pipeline/test-output
          run-id: ${{ '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier le moteur
        run: python -m unittest discover -s tests -v
      - name: Installer les dépendances
        run: |
          pip install -r backend/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Choisir l'image Rachel
        env:
          RACHEL_IMAGE: ${{ 'Rachel Tertiaire' }}
        run: |
          case "$RACHEL_IMAGE" in
            'Rachel Tertiaire') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Tertiaire.png' >> "$GITHUB_ENV" ;;
            'Rachel BTP') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel BTP.png' >> "$GITHUB_ENV" ;;
            'Rachel Agriculture') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Agriculture.png' >> "$GITHUB_ENV" ;;
            'Rachel Industrie') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Industrie.png' >> "$GITHUB_ENV" ;;
            'Rachel Restauration') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Restauration.png' >> "$GITHUB_ENV" ;;
            'Rachel Logistique et Transport') echo 'RACHEL_ENTERPRISE_PHOTO_PATH=../assets/Rachel Logistique et Transport.png' >> "$GITHUB_ENV" ;;
            *) echo "Image Rachel inconnue : $RACHEL_IMAGE"; exit 1 ;;
          esac
      - name: Tester la capsule avec les accès Rachel existants
        if: 'youtube_unlisted' != 'youtube_existing' && 'youtube_unlisted' != 'youtube_finalize'
        env:
          PYTHONUNBUFFERED: '1'
          TEST_MODE: ${{ 'youtube_unlisted' == 'check' && 'check' || 'video' }}
          COMPANY_NAME: ${{ 'Décisions & Co' }}
          COMPANY_SITE: ${{ 'https://www.decisionsandco.com' }}
          SOURCE_TEXT: ${{ '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u -m backend.first_capsule
      - name: Publier la capsule sur YouTube
        if: 'youtube_unlisted' == 'youtube_private' || 'youtube_unlisted' == 'youtube_unlisted' || 'youtube_unlisted' == 'youtube_existing' || 'youtube_unlisted' == 'youtube_finalize'
        env:
          TEST_MODE: ${{ 'youtube_unlisted' }}
          EXISTING_YOUTUBE_ID: ${{ '' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u -m backend.publish_capsule
      - name: Transmettre le résultat à La Fabrik
        if: always() && '' != '' && 'youtube_unlisted' != 'check'
        env:
          LEAD_CALLBACK_URL: ${{ '' }}
          LEAD_REQUEST_ID: ${{ '' }}
          LEAD_REQUEST_KEY: ${{ '' }}
          LEAD_CALLBACK_SECRET: ${{ secrets.LEAD_CALLBACK_SECRET }}
        run: python -u -m backend.lead_callback
      - name: Conserver la vidéo et le rapport
        if: always() && 'youtube_unlisted' != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: rachel-capsule-${{ github.run_id }}
          path: |
            lead_pipeline/test-output/checkpoint.json
            lead_pipeline/test-output/voice.mp3
            lead_pipeline/test-output/rachel.mp4
            lead_pipeline/test-output/report.json
          if-no-files-found: ignore
          retention-days: 7
