name: Aperçu Rachel Bureau
on:
  push:
    branches:
      - test/rachel-bureau-preview-2026-11-19
    paths:
      - .github/workflows/rachel-bureau-preview.yml
permissions:
  contents: read
concurrency:
  group: rachel-bureau-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install requests feedparser pillow
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Générer un Short de test avec HeyGen
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python -u - <<'PY'
          import os
          from pathlib import Path
          from agent_short_video_avatar import (
              download_video, generate_avatar_video, generate_voice, upload_audio_to_heygen,
          )
          from rachel_catalogue import ensure_asset, load_catalogue
          from youtube_short_policy import inspect_video, media_duration, render_avatar_short

          for name in ("HEYGEN_API_KEY", "ELEVENLABS_API_KEY", "ELEVENLABS_VOICE_ID"):
              if not os.environ.get(name):
                  raise RuntimeError(f"Secret requis absent : {name}")
          title = "Un outil IA peut-il vraiment lire vos factures ?"
          narration = (
              "Un outil IA peut-il vraiment lire vos factures ? "
              "Pour le savoir, prenez dix factures dont vous connaissez déjà les montants. "
              "Demandez à l’outil de relever le fournisseur, le total et la date d’échéance. "
              "Puis comparez chaque résultat au document d’origine. "
              "Testez une facture scannée, une devise étrangère et un avoir. "
              "Ce sont souvent ces cas qui font trébucher l’automatisation. "
              "Si l’outil hésite, la facture doit revenir à une personne pour vérification. "
              "Une facture ambiguë mérite de rester en attente."
          )
          look = next(look for look in load_catalogue()["looks"] if look["id"] == "bureau")
          audio = generate_voice(narration, Path("preview-voice.mp3"))
          duration = media_duration(audio)
          if not 10 <= duration <= 55:
              raise ValueError(f"Durée de narration hors plage : {duration:.2f} s")
          print(f"Voix générée : {duration:.2f} s")
          image_id = ensure_asset(look)
          audio_id = upload_audio_to_heygen(audio)
          print("Portrait Bureau et voix envoyés à HeyGen")
          video_url = generate_avatar_video(image_id, audio_id, title)
          raw = download_video(video_url, Path("preview-raw.mp4"))
          final = render_avatar_short(raw, title, Path("Rachel-Bureau-Test.mp4"), reference_audio=audio)
          print(f"Rendu vertical vérifié : {inspect_video(final):.2f} s")
          PY
