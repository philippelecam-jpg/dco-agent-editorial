name: Test Schedule Prospective

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Paris"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le déclenchement
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
          echo "Paris: $(TZ=Europe/Paris date)"
