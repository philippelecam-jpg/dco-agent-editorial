name: Agent Short Video Avatar (Rachel / YouTube)

on:
  workflow_dispatch:
    inputs:
      force_publication:
        description: "Publication hors planning (contrôles de durée et doublons maintenus)"
        type: boolean
        default: false

concurrency:
  group: youtube-shorts-publication
  cancel-in-progress: false

jobs:
  short-video-avatar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install requests feedparser pillow requests_oauthlib

      - name: Run avatar short video agent
        env:
          FORCE_PUBLICATION: ${{ inputs.force_publication && 'true' || 'false' }}
          YOUTUBE_PLAYLIST_IDS: ${{ secrets.YOUTUBE_PLAYLIST_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          RACHEL_PHOTO_ASSET_ID: ${{ secrets.RACHEL_PHOTO_ASSET_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Lues à l'import de agent.py même si non utilisées ici -- même
          # convention que les autres modules satellites du dispositif.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: python agent_short_video_avatar.py

      - name: Commit updated history
        if: always()
        run: |
          if [ -n "$(git status --porcelain youtube_publications.json short_video_avatar_history.json)" ]; then
            git config user.name "dco-agent-editorial"
            git config user.email "actions@github.com"
            if [ -f youtube_publications.json ]; then git add youtube_publications.json; fi
            git add short_video_avatar_history.json
            git commit -m "chore: update short_video_avatar history [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -sS -X POST "$MAKE_WEBHOOK_URL" \
            -H "x-make-apikey: $MAKE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"alerte\": \"echec_short_video_avatar\", \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
