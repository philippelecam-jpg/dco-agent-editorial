name: TEST E2E - carrousel Instagram (publication reelle)
on:
  workflow_dispatch:
    inputs:
      confirmer_publication:
        description: "Saisir PUBLIER pour autoriser un vrai post Instagram"
        required: true
        type: string
concurrency:
  group: rachel-instagram-publication
  cancel-in-progress: false
jobs:
  test_e2e:
    if: inputs.confirmer_publication == 'PUBLIER'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/carrousel-decisions-reunions-2026-11
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparer rendu
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install requests pillow
      - name: Generer, rendre, publier et verifier
        env:
          E2E_TARGET_BRANCH: test/carrousel-decisions-reunions-2026-11
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python -u scripts/e2e_instagram_carousel.py
