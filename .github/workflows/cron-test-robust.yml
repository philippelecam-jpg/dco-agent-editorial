name: Cron Test Robust

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "UTC: $(date -u)"
          echo "Cron schedule received: ${{ github.event.schedule }}"
