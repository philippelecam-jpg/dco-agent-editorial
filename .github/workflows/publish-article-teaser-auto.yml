name: Agent Éditorial D&Co — Teaser LinkedIn (auto)

on:
  schedule:
    # Tous les jours à 9h23 Paris, hiver et été -- détecte tout article
    # publié depuis le dernier passage, quel que soit le jour.
    # CORRECTIF : le fichier précédent n'avait qu'une seule ligne cron
    # ('0 8 * * *'), alors que le commentaire décrivait déjà une intention
    # saisonnière ("8h UTC hiver / 7h UTC été") jamais codée -- résultat,
    # le run tournait en réalité à 10h Paris l'été au lieu de 9h. Corrigé
    # avec les deux lignes, comme les autres workflows du dispositif.
    # Minute décalée à :23 pour éviter la congestion aux heures rondes.
    - cron: '23 8 * * *'   # 9h23 Paris en hiver (CET, UTC+1)
    - cron: '23 7 * * *'   # 9h23 Paris en été (CEST, UTC+2)
  workflow_dispatch: {}

jobs:
  detect-and-teaser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests requests-oauthlib Pillow

      - name: Détecter les nouveaux articles et publier le teaser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Réutilisés : ce script importe agent.py (mêmes contraintes que
          # les autres scripts du repo).
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: python agent_article_teaser_auto.py
