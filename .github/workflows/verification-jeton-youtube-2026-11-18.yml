name: Vérification du nouveau jeton YouTube
on:
  push:
    branches: [test/verification-jeton-youtube-2026-11-18]
    paths: [.github/workflows/verification-jeton-youtube-2026-11-18.yml]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Vérifier les droits, la chaîne et les playlists
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_IDS: ${{ secrets.YOUTUBE_PLAYLIST_IDS }}
        run: |
          python - <<'PY'
          import json, os, requests
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "grant_type": "refresh_token",
          }, timeout=30)
          if not r.ok:
              raise SystemExit(f"VERIFICATION_ECHEC renouvellement du token HTTP {r.status_code}")
          token = r.json()["access_token"]
          print("::add-mask::" + token)
          info = requests.get("https://oauth2.googleapis.com/tokeninfo", params={"access_token": token}, timeout=30)
          if not info.ok:
              raise SystemExit(f"VERIFICATION_ECHEC contrôle des droits HTTP {info.status_code}")
          scopes = set(info.json().get("scope", "").split())
          required = {"https://www.googleapis.com/auth/youtube.force-ssl", "https://www.googleapis.com/auth/youtube"}
          if not required.intersection(scopes):
              raise SystemExit("VERIFICATION_ECHEC droit playlistItems.insert absent")
          print("VERIFICATION_OK droit de gestion des playlists accordé")
          headers = {"Authorization": "Bearer " + token}
          def read(endpoint, **params):
              response = requests.get("https://www.googleapis.com/youtube/v3/" + endpoint,
                                      headers=headers, params=params, timeout=30)
              if not response.ok:
                  raise SystemExit(f"VERIFICATION_ECHEC {endpoint} HTTP {response.status_code}")
              return response.json()
          mine = read("channels", part="snippet", mine="true").get("items", [])
          expected = read("channels", part="id", forHandle="@Rachel-DecisionsAndCo").get("items", [])
          if len(mine) != 1 or len(expected) != 1 or mine[0]["id"] != expected[0]["id"]:
              raise SystemExit("VERIFICATION_ECHEC la chaîne autorisée ne correspond pas à Rachel-DecisionsAndCo")
          channel = mine[0]
          print("VERIFICATION_OK chaîne " + channel["snippet"]["title"] + " (" + channel["id"] + ")")
          configured = json.load(open("config/youtube.json", encoding="utf-8"))["playlists"]
          configured.update(json.loads(os.environ.get("YOUTUBE_PLAYLIST_IDS") or "{}"))
          for name, playlist_id in configured.items():
              found = read("playlists", part="snippet,status", id=playlist_id).get("items", [])
              if (len(found) != 1 or found[0]["snippet"]["channelId"] != channel["id"]
                  or found[0]["status"]["privacyStatus"] != "public"):
                  raise SystemExit("VERIFICATION_ECHEC playlist " + name)
              print("VERIFICATION_OK playlist " + found[0]["snippet"]["title"])
          print("VERIFICATION_TERMINEE jeton et quatre playlists accessibles")
          PY
