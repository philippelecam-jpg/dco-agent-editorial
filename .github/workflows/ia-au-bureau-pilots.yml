name: IA au bureau - génération privée et reprise
on:
  workflow_dispatch:
    inputs:
      format:
        description: Format du nouveau pilote
        type: choice
        options: [animation, realiste]
        default: animation
      resume_run_id:
        description: ID d'une exécution existante à reprendre sans générer à nouveau
        type: string
        default: ''
      checkpoint_name:
        description: Nom du checkpoint de l'exécution à reprendre
        type: choice
        options: [ia-pilots-checkpoint, realistic-checkpoint]
        default: ia-pilots-checkpoint
permissions:
  contents: read
  actions: read
concurrency:
  group: ia-au-bureau-pilots
  cancel-in-progress: false
jobs:
  pilots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Vérifier la référence de reprise
        env:
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          if [ -n "$RESUME_RUN" ] && ! [[ "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Identifiant de reprise invalide'; exit 1
          fi
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: ${{ inputs.checkpoint_name }}
          path: pilot-output
      - name: Générer de nouvelles vidéos privées
        if: inputs.resume_run_id == ''
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PILOT_FORMAT: ${{ inputs.format }}
        run: |
          if [ "$PILOT_FORMAT" = realiste ]; then
            python -u scripts/ia_realistic.py
          else
            python -u scripts/ia_pilots.py submit
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-pilots-checkpoint
          path: pilot-output/checkpoint.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Récupérer les rendus existants
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python -u scripts/ia_pilots.py poll
      - name: Chiffrer les fichiers de revue
        if: always()
        run: |
          if [ -d pilot-output ]; then
            python -c "import shutil; shutil.make_archive('ia-pilots-private','zip','pilot-output')"
            openssl cms -encrypt -binary -aes-256-gcm -in ia-pilots-private.zip -out ia-pilots-private.cms -outform DER pilots/ia_au_bureau/review-public.pem
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-pilots-private
          path: ia-pilots-private.cms
          retention-days: 30
          if-no-files-found: ignore
