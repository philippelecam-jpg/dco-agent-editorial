name: Vérifier les voix disponibles pour Mina et Nino
on:
  push:
    branches: ['fix/ia-bureau-controlled-v2']
    paths: ['.github/workflows/ia-v2-voices.yml']
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Lire les voix sans générer de son
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,requests
          results={}
          for gender in ['female','male']:
              r=requests.get('https://api.heygen.com/v3/models/audio/voices',headers={'x-api-key':os.environ['HEYGEN_API_KEY']},params={'type':'public','language':'fr','gender':gender,'limit':10},timeout=60)
              if not r.ok: raise RuntimeError('HeyGen voix HTTP '+str(r.status_code))
              results[gender]=r.json()
          open('voices.json','w').write(json.dumps(results,ensure_ascii=False))
          print('Voix françaises récupérées pour revue.')
          PY
          openssl cms -encrypt -binary -aes-256-gcm -in voices.json -out voices.cms -outform DER pilots/ia_au_bureau/review-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: voices-private
          path: voices.cms
          retention-days: 7
