name: IA au bureau - récupérer le complément réaliste
on:
  push:
    branches: ['feat/ia-au-bureau-pilots-2026-11-20']
    paths: ['.github/workflows/ia-realistic-resume.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ia-realistic-resume
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44767183314'
          name: realistic-checkpoint
          path: pilot-output
      - name: Attendre le rendu
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python -u scripts/ia_pilots.py poll
      - name: Chiffrer le résultat privé
        if: always()
        run: |
          python -c "import shutil; shutil.make_archive('realistic-private','zip','pilot-output')"
          openssl cms -encrypt -binary -aes-256-gcm -in realistic-private.zip -out realistic-private.cms -outform DER pilots/ia_au_bureau/review-public.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realistic-private
          path: realistic-private.cms
          retention-days: 30
