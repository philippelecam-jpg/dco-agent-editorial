name: Test Schedule Prospective

on:
  schedule:
    # Test toutes les 5 minutes en UTC, sans timezone.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le déclenchement
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
