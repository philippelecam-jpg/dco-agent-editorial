name: IA au bureau - reprendre le montage V2
on:
  push:
    branches: ['fix/ia-bureau-controlled-v2']
    paths: ['.github/workflows/ia-controlled-resume.yml']
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Exécution précédente à reprendre sans nouvelle génération
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ia-bureau-controlled
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils
        run: |
          pip install requests cryptography
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Vérifier la référence de reprise
        env:
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          if [ -n "$RESUME_RUN" ] && ! [[ "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
      - uses: actions/download-artifact@v4
        if: always()
        with:
          github-token: ${{ github.token }}
          run-id: '44774965709'
          name: controlled-restart
      - name: Restaurer les fichiers privés existants
        if: always()
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python scripts/ia_controlled.py restore
      - name: Créer les voix et les plans puis monter la V2
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python -u scripts/ia_controlled.py build
      - name: Conserver une reprise automatique chiffrée
        if: always()
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ -d controlled-output ]; then python scripts/ia_controlled.py archive; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-restart
          path: controlled-restart.enc
          retention-days: 30
          if-no-files-found: ignore
      - name: Chiffrer tous les fichiers et références de reprise
        if: always()
        run: |
          if [ -d controlled-output ]; then
            python -c "import shutil; shutil.make_archive('controlled-private','zip','controlled-output')"
            openssl cms -encrypt -binary -aes-256-gcm -in controlled-private.zip -out controlled-private.cms -outform DER pilots/ia_au_bureau/review-public.pem
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-private
          path: controlled-private.cms
          retention-days: 30
          if-no-files-found: ignore
