name: Agent Éditorial D&Co

on:
  schedule:
    # 7h07 heure de Paris, hiver et été (décalé de la minute 0 pour éviter
    # la congestion documentée par GitHub aux heures rondes -- le run du
    # 26 août a subi ~1h de retard, probablement lié à ce problème connu).
    - cron: '7 6 * * 1-5'   # 7h07 Paris en hiver (CET, UTC+1)
    - cron: '7 5 * * 1-5'   # 7h07 Paris en été (CEST, UTC+2)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mode test (publie 5 tweets espacés de 60s)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests requests-oauthlib Pillow

      - name: Lancer l'agent (mode normal)
        if: ${{ github.event.inputs.test_mode != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}          
        run: python agent.py

      - name: Lancer l'agent (mode test — 5 tweets x 60s)
        if: ${{ github.event.inputs.test_mode == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}          
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Run $i/5 ==="
            python agent.py
            if [ $i -lt 5 ]; then
              echo "Pause 60s avant le run suivant..."
              sleep 60
            fi
          done

      - name: Commit et push du package
        run: |
          git config user.name "Agent Editorial DCo"
          git config user.email "agent@decisionsandco.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Package éditorial $(date '+%Y-%m-%d-%H%M')"
          git push
